<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}違規偵測實驗平台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">違規偵測實驗平台</a>
  <nav>
    <a href="{{ url_for('index') }}">實驗</a>
    <a href="{{ url_for('videos_page') }}">影片與真值</a>
    <a href="{{ url_for('compare') }}">比較</a>
    <a href="{{ url_for('calibration_page') }}">相機標定</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script>
// 影片預覽: 滑鼠停在影片上 1 秒自動播放 (靜音), 移開就停止並回到開頭
document.querySelectorAll('video.hover-preview').forEach(v => {
  let timer;
  v.addEventListener('mouseenter', () => { timer = setTimeout(() => v.play().catch(() => {}), 1000); });
  v.addEventListener('mouseleave', () => { clearTimeout(timer); v.pause(); v.currentTime = 0.1; });
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
